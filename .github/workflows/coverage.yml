name: Coverage

# PAUSED on the OCaml 5.4 bump (#165). bisect_ppx (<= 2.8.3) requires
# ppxlib < 0.36, but 5.4.1 forces lwt_ppx 6.1 -> ppxlib 0.38, so bisect_ppx
# and lwt_ppx are mutually exclusive on 5.4. Coverage cannot run until
# bisect_ppx supports ppxlib >= 0.36. Tracked in #166.
# Manual-only until then; restore the push/tags triggers below to re-enable.
on:
  workflow_dispatch:
  # push:
  #   branches: ["main"]
  #   tags: ["v*"]

env:
  COVERAGE_THRESHOLD: "85"

jobs:
  coverage:
    runs-on: ubuntu-latest
    container:
      image: ocaml/opam:ubuntu-24.04-ocaml-5.4
      options: --user root

    steps:
      - name: Install Node.js (needed by actions/checkout)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nodejs

      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get install -y -q pkg-config libgmp-dev bc

      - name: Cache opam packages
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-5.4-cov-${{ hashFiles('granary.opam') }}
          restore-keys: opam-5.4-cov-

      - name: Install opam packages (including bisect_ppx)
        run: |
          opam install -y lwt cstruct menhir alcotest qcheck-alcotest lwt_ppx bisect_ppx \
            mirage-block mirage-block-unix uutf uucp

      - name: Build and run instrumented tests
        run: |
          opam exec -- dune runtest --instrument-with bisect_ppx

      - name: Generate coverage summary
        id: coverage
        run: |
          COVFILES=$(find _build -name '*.coverage' | tr '\n' ' ')
          if [ -z "${COVFILES// }" ]; then
            echo "ERROR: no coverage files found" >&2
            exit 1
          fi

          # bisect-ppx-report has no --exclude-files flag; filter generated files via Python.
          SUMMARY=$(opam exec -- bisect-ppx-report summary --per-file $COVFILES | python3 -c "
          import sys, re
          generated = {'lib/sql/parser.ml', 'lib/sql/lexer.ml'}
          total_hit = 0
          total_pts = 0
          lines = []
          for line in sys.stdin:
              line = line.rstrip()
              m = re.match(r'\s*(\d+\.\d+)\s*%\s+(\d+)/(\d+)\s+(.+)', line)
              if m:
                  pct, hit, pts, path = m.group(1), int(m.group(2)), int(m.group(3)), m.group(4).strip()
                  if path not in generated:
                      total_hit += hit
                      total_pts += pts
                      lines.append(line)
          for l in lines:
              print(l)
          overall = 100.0 * total_hit / total_pts if total_pts else 0.0
          print(f'{overall:6.2f} %  {total_hit:4d}/{total_pts:4d}   Handwritten total (excl. generated parser+lexer)')
          ")
          echo "$SUMMARY"
          PCT=$(echo "$SUMMARY" | tail -1 | python3 -c "import sys,re; m=re.search(r'(\d+\.\d+)\s*%', sys.stdin.read()); print(m.group(1)) if m else print(0)")
          echo "pct=${PCT}" >> "$GITHUB_OUTPUT"
          echo ""
          echo "Overall coverage: ${PCT}%"

      - name: Generate HTML report
        run: |
          COVFILES=$(find _build -name '*.coverage' | tr '\n' ' ')
          mkdir -p _coverage
          opam exec -- bisect-ppx-report html -o _coverage $COVFILES

      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: _coverage/
          retention-days: 30

      - name: Enforce threshold on tags
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PCT="${{ steps.coverage.outputs.pct }}"
          echo "Coverage: ${PCT}%  threshold: ${COVERAGE_THRESHOLD}%"
          if (( $(echo "$PCT < $COVERAGE_THRESHOLD" | bc -l) )); then
            echo "FAIL: coverage ${PCT}% is below threshold ${COVERAGE_THRESHOLD}%"
            exit 1
          fi
          echo "PASS: ${PCT}% >= ${COVERAGE_THRESHOLD}%"
