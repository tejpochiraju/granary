name: Cross-arch

# Cross-platform build+test matrix (#157): proves the engine builds and the full
# suite passes on both linux/amd64 and linux/arm64. The on-disk format is
# explicitly byte-ordered and there are no C stubs, so the encoding/B-tree/WAL
# and QCheck fuzz suites are the canaries for any latent endianness / word-size
# regression.
#
# This is NOT wired into the per-PR pipeline: the arm64 leg runs under qemu-user
# emulation and is far too slow to gate every PR. It runs weekly and on demand
# instead; the runtime is recorded in the job log so we can later decide whether
# a native arm64 runner is worth it. amd64 here is native and fast — it doubles
# as an independent cross-check of the main CI leg.
#
# Unlike the Forgejo version of this workflow, this one can't use a job-level
# `container:` for the arm64 leg: GitHub Actions starts that container before
# any step runs, so QEMU's binfmt handlers must already be registered on the
# bare runner first. docker/setup-qemu-action@v3 does that, then each step
# below runs the actual work via explicit `docker run --platform=...`.

on:
  workflow_dispatch:
  schedule:
    # Mondays 04:30 UTC — off the nightly Jepsen slot.
    - cron: "30 4 * * 1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Record start time
        run: echo "START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Set up QEMU (for the arm64 leg)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Build + test in container
        env:
          # Same timing-gate neutralization as the main CI leg: the bench_*
          # suites run for smoke coverage but their wall-time thresholds are
          # meaningless under emulation, so disable them here (esp. arm64/qemu).
          GRANARY_BENCH_MIN_SPEEDUP: "0"
          GRANARY_BENCH_PARALLEL_MAX: "1000000"
          GRANARY_BENCH_MAX_WRITER_S: "1000000"
          GRANARY_BENCH_MAX_RATIO: "1000000"
        run: |
          docker run --rm --platform=linux/${{ matrix.arch }} --user root \
            -v "$PWD":/workspace -w /workspace \
            -e HOME=/home/opam -e OPAMROOT=/home/opam/.opam \
            -e GRANARY_BENCH_MIN_SPEEDUP -e GRANARY_BENCH_PARALLEL_MAX \
            -e GRANARY_BENCH_MAX_WRITER_S -e GRANARY_BENCH_MAX_RATIO \
            ocaml/opam:ubuntu-24.04-ocaml-5.4 bash -c '
              set -eu
              echo "matrix.arch=${{ matrix.arch }}"
              uname -m
              sudo apt-get update -q
              sudo apt-get install -y -q pkg-config libgmp-dev libsqlite3-dev
              opam exec -- ocamlfind ocamlc -config | grep -E "^(architecture|word_size):" || true
              opam install -y lwt cstruct menhir alcotest qcheck-alcotest lwt_ppx \
                mirage-block mirage-block-unix uutf uucp ocamlformat.0.29.0 \
                mirage-crypto mirage-crypto-rng alcotest-lwt sqlite3 \
                nottui nottui-lwt lwd
              opam exec -- dune build
              opam exec -- dune runtest
            '

      - name: Record runtime
        if: always()
        run: |
          END_EPOCH=$(date +%s)
          ELAPSED=$(( END_EPOCH - START_EPOCH ))
          echo "::notice title=cross-arch runtime::${{ matrix.arch }} build+test took ${ELAPSED}s"
          echo "Cross-arch (${{ matrix.arch }}) build+test wall time: ${ELAPSED}s"
