name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      OPAMROOT: /home/opam/.opam
    container:
      image: ocaml/opam:ubuntu-24.04-ocaml-5.4
      options: --user root

    steps:
      - name: Install Node.js (needed by actions/checkout)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nodejs

      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get install -y -q pkg-config libgmp-dev libsqlite3-dev

      - name: Cache opam packages
        uses: actions/cache@v4
        with:
          # #735: NOT `~/.opam`.  This job runs its container with
          # `--user root`, so `HOME` is `/root` and `~/.opam` resolves to
          # `/root/.opam` — a path opam never writes, because the job-level
          # `OPAMROOT` above points at `/home/opam/.opam`.  The cache therefore
          # stored and restored nothing, and this job paid a full `opam install`
          # on every run.  The `.forgejo/` copy of this step is deliberately
          # NOT the same: the self-hosted runner sets no `--user root` and no
          # `OPAMROOT`, so its `~/.opam` already IS the opam root.  This step is
          # not in check-workflow-parity.sh's SHARED_STEPS, so the divergence is
          # intended and unguarded — like the runner labels around it.
          path: ${{ env.OPAMROOT }}
          # Prefix bumped `opam-5.4-` -> `opam-5.4-gh2-` alongside the path fix:
          # the first run under a working path populates an entry that every
          # later run inherits through `restore-keys`, so it must not be able to
          # inherit anything written under the broken path.  `restore-keys` is a
          # prefix match, so bench-nightly.yml's `opam-5.4-` still finds this
          # entry.
          key: opam-5.4-gh2-${{ hashFiles('granary.opam', 'granary_repl.opam') }}
          restore-keys: opam-5.4-gh2-

      - name: Install opam packages
        run: |
          opam install -y lwt cstruct menhir alcotest qcheck-alcotest lwt_ppx \
            mirage-block mirage-block-unix uutf uucp ocamlformat.0.29.0 \
            mirage-crypto mirage-crypto-rng alcotest-lwt sqlite3 \
            nottui nottui-lwt lwd

      - name: Build
        run: opam exec -- dune build

      - name: Check formatting (#171)
        run: opam exec -- dune build @fmt

      - name: Test
        # The bench_* suites run under `dune runtest` for smoke coverage, but
        # their timing pass/fail thresholds (speedup floor / wall-time ceilings)
        # are unreliable on a shared, loaded CI runner and flake on any PR.
        # Neutralize the timing gates here so CI does not fail on load; the
        # benches still execute and print their measurements to the log.
        # GRANARY_BENCH_MAX_RATIO also covers test_fts_scaling's O(log n) ratio
        # gate (#262), whose sub-millisecond 1k baseline is noise-dominated here.
        env:
          GRANARY_BENCH_MIN_SPEEDUP: "0"
          GRANARY_BENCH_PARALLEL_MAX: "1000000"
          GRANARY_BENCH_MAX_WRITER_S: "1000000"
          GRANARY_BENCH_MAX_RATIO: "1000000"
          # #730: read_page_yields_to_timer_test in test_unix_file is a
          # wall-clock gate too, and was missing from this list — so a loaded
          # runner could fail a PR that changed nothing.
          GRANARY_BENCH_MAX_TIMER_S: "1000000"
        run: opam exec -- dune runtest

      - name: Report test count
        run: |
          # Informational only — `dune runtest` above is the actual gate.
          # Some exes (e.g. test_sqlite_corpus) need dune's data-dependency
          # sandbox and exit non-zero when run standalone from the repo root,
          # so a failure here must not fail the job.
          for exe in _build/default/test/test_*.exe; do
            name=$(basename "$exe" .exe)
            result=$("$exe" 2>&1 | tail -1) || result="(skipped: not standalone-runnable)"
            echo "$name: $result"
          done

  lint:
    runs-on: ubuntu-latest
    env:
      OPAMROOT: /home/opam/.opam
    # Enforcing (#173): the curated merlint set is at zero, so findings now
    # block the build. History: adopted warn-first in #153, ratcheted to zero
    # via #167/#168/#173, flipped to blocking once #171 (ocamlformat) cleared
    # the last finding (E500).
    container:
      image: ocaml/opam:ubuntu-24.04-ocaml-5.4
      options: --user root

    steps:
      - name: Install Node.js (needed by actions/checkout)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nodejs

      - uses: actions/checkout@v4

      - name: Install system deps + shellcheck (#591)
        # Renamed away from the build-and-test job's identically-worded step so
        # that check-workflow-parity.sh can name it: extract_step takes the
        # FIRST step of a given name in a file, so two jobs sharing one name
        # makes the lint job's copy unaddressable and its drift invisible.
        run: |
          sudo apt-get install -y -q pkg-config libgmp-dev libsqlite3-dev shellcheck

      - name: Cache opam packages
        uses: actions/cache@v4
        with:
          # #735: NOT `~/.opam` — see the build-and-test job's copy of this step
          # for why, and for why the `.forgejo/` copy legitimately still says
          # `~/.opam`.
          path: ${{ env.OPAMROOT }}
          # #728: the prefix was bumped `lint` -> `lint2` to EVICT the poisoned
          # entry rather than only cope with it.  `actions/cache` skips its save
          # step when the primary key hits, and that key is a hash of two rarely
          # changing files — so the bad entry would otherwise be restored by
          # every future run via `restore-keys`, forever.  The cleanup in the
          # next step is still the belt: it covers a cache that gets poisoned
          # again, which a one-time key bump cannot.
          #
          # #735: bumped again `lint2` -> `lint3` for the path fix above.  Until
          # now this job's cache never stored anything, so the first run under a
          # working path is the first real entry — and it must not start life by
          # restoring whatever `lint2` did or did not hold.
          key: opam-5.4-lint3-${{ hashFiles('granary.opam', 'granary_repl.opam') }}
          restore-keys: opam-5.4-lint3-

      - name: Install opam packages + merlint
        run: |
          opam install -y lwt cstruct menhir alcotest qcheck-alcotest lwt_ppx \
            mirage-block mirage-block-unix uutf uucp \
            mirage-crypto mirage-crypto-rng alcotest-lwt sqlite3 \
            nottui nottui-lwt lwd
          # merlint is git-only (no opam release); pin the known-good commit.
          #
          # Clear any pin and its source tree FIRST (#728).  The `~/.opam` cache
          # restored above can carry a partial or broken
          # `.opam-switch/sources/merlint` checkout; opam then tries to
          # *synchronize* that directory rather than clone a fresh one, and
          # `git fetch` inside a broken repo exits 128 — failing the job with
          #   Could not synchronize .../sources/merlint ... exited with code 128
          # while the pinned commit itself is perfectly fetchable.  Because the
          # cache key falls back through `restore-keys`, one poisoned entry
          # fails every later run that restores it.  Observed 2026-09-02 on the
          # lint job; the build-and-test job has its own cache and no pin, which
          # is why only lint was affected.
          #
          # This weakens no gate: the same commit is pinned either way, and
          # merlint still blocks on findings (#173).
          # `|| true` alone makes the "not pinned" case non-fatal; stderr is
          # kept deliberately, so that if this line ever fails for some OTHER
          # reason the log still shows it — this is the step that exists to
          # unbreak the lint job (#728).
          opam pin remove -y merlint >/dev/null || true
          rm -rf "$(opam var prefix)/.opam-switch/sources/merlint"
          opam pin add -y -k git merlint \
            "https://github.com/samoht/merlint.git#d5548822dea1ad3b845eabd4b569946a05e42423"

      - name: Build (so merlint has artifacts for type analysis)
        run: opam exec -- dune build

      - name: Run merlint
        run: opam exec -- merlint --color=never

      - name: Policy — no real-SQLite outside gated comparison files (#370)
        # The allowlists, the rationale for their deliberate asymmetry, and the
        # staleness check all live in the script so that there is ONE place to
        # edit instead of four (two greps x two workflow files).  test/dune
        # points at it, which is where an author adding a comparison file
        # already is.  See #574.
        run: sh scripts/check-sqlite-policy.sh

      - name: Workflow mirror drift check (.forgejo vs .github)
        run: sh scripts/check-workflow-parity.sh

      - name: Shell lint — shellcheck over scripts/ (#591)
        # scripts/ holds enforcement gates, and an enforcement gate breaks by
        # PERMITTING things: it fails green.  PR #582 shipped a demonstrated
        # fail-open of that shape and it was caught only by hand, because there
        # was no lint gate on shell at all.  The script self-tests on every run
        # (planted violation must be rejected, clean script accepted) and fails
        # closed when shellcheck is missing, so a green result means a tree that
        # was actually checked.
        run: sh scripts/check-shell.sh
