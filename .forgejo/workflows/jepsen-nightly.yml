name: Jepsen nightly (#177)

# Full single-node Jepsen suite (all workloads × mem/file/wal/enc-wal, plus the
# crash-restart / process-pause / lazyfs / clock-skew nemeses) and the Elle/Clojure
# checkers, gated by jepsen/run/ci_full.sh. Heavy (~8-10 min once the image layers
# are cached; the first run builds the lazyfs + Clojure + harness image, ~20 min),
# so it runs nightly rather than per-PR. The OCaml lost-update regression
# (test_concurrent_rmw_223) already runs per-PR inside `dune runtest`.
#
# Runs in act_runner "host mode" (no job container). Note that host mode does NOT
# mean the bare metal host: the job executes inside the otp-forgejo-runner
# container (Alpine, non-root uid 1000, no node/sudo/apt). That container has the
# podman CLI plus the host's rootless podman socket mounted
# (CONTAINER_HOST=unix:///run/podman/podman.sock), so every `podman ...` below is
# a REMOTE client call executed by the host's podman. Two consequences (#305):
#   - JS actions (actions/checkout@v4, actions/cache@v4, ...) cannot run here —
#     there is no node and no way to install one as uid 1000. Use plain git.
#   - Bind-mount paths in `podman run -v ...` resolve on the HOST, not in this
#     job's filesystem, so the suite must not bind-mount the workspace. The
#     image already bakes the source in via `COPY . /workspace/` (the build
#     context IS this checkout, tarred over the socket by the remote build).
# Rootless podman on the host does allow `--device /dev/fuse --cap-add
# SYS_ADMIN` (verified), which lazyfs needs.

on:
  schedule:
    # 03:00 UTC daily (08:30 IST).
    - cron: "0 3 * * *"
  # Allow ad-hoc manual runs (so the suite can be triggered on demand to test).
  workflow_dispatch: {}

concurrency:
  group: jepsen-nightly
  cancel-in-progress: false

jobs:
  jepsen-full:
    runs-on: self-hosted
    steps:
      # Plain-git checkout: actions/checkout@v4 needs node, which the host-mode
      # environment lacks (see header). act gives each job a fresh random
      # workdir (<parent>/<16hex>/hostexecutor), so the wipe is only a guard
      # against leftovers. The repo is private — pass the actions token via
      # basic auth on the fetch URL only (not persisted in .git/config).
      - name: Checkout (plain git — no node in host mode)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          find . -mindepth 1 -delete
          git init -q .
          git fetch -q --depth 1 \
            "https://x-access-token:${TOKEN}@${SERVER#https://}/${REPO}.git" \
            "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      # --platform=linux/amd64 is required (#424): the runner host's rootless
      # podman image store is shared across workflows, and the weekly Cross-arch
      # job pulls the ocaml/opam base tag as arm64. Without pinning, this build's
      # `FROM` reuses that cached arm64 base and fails at the first `RUN` with
      # "Exec format error" on the amd64 host. The Containerfile FROM is pinned
      # too; this is belt-and-suspenders so the target platform is unambiguous.
      - name: Build Jepsen image (cached by podman layers across runs)
        run: podman build --platform=linux/amd64 -t sqlocaml-jepsen -f Containerfile.jepsen .

      # No -v bind mount: paths would resolve on the host (remote podman), and
      # the image already contains this checkout at /workspace via COPY.
      - name: Run full #177 suite + gate
        run: |
          podman run --rm --device /dev/fuse --cap-add SYS_ADMIN \
            -w /workspace --entrypoint bash \
            sqlocaml-jepsen jepsen/run/ci_full.sh

      # On any failure above, open a Forgejo issue so the nightly does not fail
      # silently. Deduped by title marker: if an open issue already exists for a
      # previous failing nightly, comment on it instead of opening a duplicate
      # (the scheduled job runs unattended every night).
      - name: File issue on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          MARKER: "Jepsen nightly failed"
        run: |
          set -eu
          body="The Jepsen nightly suite (#177) failed.\n\n- Run: ${RUN_URL}\n- Commit: ${GITHUB_SHA}\n- Ref: ${GITHUB_REF}\n\nSee the workflow logs for the failing workload/nemesis and the Elle checker output."
          # Look for an existing open failure issue (dedup by title marker).
          existing=$(curl -sS \
            -H "Authorization: token ${TOKEN}" \
            "${API}/issues?state=open&type=issues&q=$(printf '%s' "${MARKER}" | tr ' ' '+')")
          number=$(printf '%s' "${existing}" | grep -o "\"number\":[0-9]*" | head -n1 | grep -o "[0-9]*" || true)
          if printf '%s' "${existing}" | grep -q "${MARKER}" && [ -n "${number}" ]; then
            echo "Open failure issue #${number} exists; adding a comment."
            curl -sSf -X POST \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"body\": \"Failed again on run ${RUN_URL} (commit ${GITHUB_SHA}).\"}" \
              "${API}/issues/${number}/comments" >/dev/null
          else
            echo "No open failure issue; opening one."
            curl -sSf -X POST \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"title\": \"${MARKER} (run ${{ github.run_number }})\", \"body\": \"${body}\"}" \
              "${API}/issues" >/dev/null
          fi
