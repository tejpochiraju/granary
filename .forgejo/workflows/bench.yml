name: Benchmark (#345)

on:
  workflow_dispatch:
    inputs:
      host_label:
        description: Label for the result CSV/meta (default "bench-ci")
        required: false
        default: bench-ci
      rows:
        description: Dataset rows (default 100000)
        required: false
        default: "100000"
      ops:
        description: Point-lookup ops (default 20000)
        required: false
        default: "20000"
      scans:
        description: Scan/agg repeats (default 50)
        required: false
        default: "50"
      commits:
        description: Single-row txns (default 500)
        required: false
        default: "500"
      repeats:
        description: Timed repeats (default 5)
        required: false
        default: "5"
      page_cache:
        description: Page-cache pages (default 1024)
        required: false
        default: "1024"

concurrency:
  group: bench
  cancel-in-progress: true

jobs:
  bench:
    runs-on: self-hosted
    container:
      image: ocaml/opam:ubuntu-24.04-ocaml-5.4

    steps:
      - name: Install Node.js (needed by actions/checkout)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nodejs

      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get install -y -q pkg-config libgmp-dev libsqlite3-dev sqlite3

      - name: Cache opam packages
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-5.4-bench-${{ hashFiles('sqlocaml.opam') }}
          restore-keys: opam-5.4-bench-

      - name: Install opam packages
        run: |
          opam install -y lwt cstruct menhir lwt_ppx \
            mirage-block mirage-block-unix uutf uucp \
            mirage-crypto mirage-crypto-rng sqlite3

      - name: Run benchmark
        id: run
        env:
          RAW_LABEL: ${{ github.event.inputs.host_label }}
          SQLOCAML_BENCH_ROWS: ${{ github.event.inputs.rows }}
          SQLOCAML_BENCH_OPS: ${{ github.event.inputs.ops }}
          SQLOCAML_BENCH_SCANS: ${{ github.event.inputs.scans }}
          SQLOCAML_BENCH_COMMITS: ${{ github.event.inputs.commits }}
          SQLOCAML_BENCH_REPEATS: ${{ github.event.inputs.repeats }}
          SQLOCAML_BENCH_PAGE_CACHE: ${{ github.event.inputs.page_cache }}
        run: |
          LABEL="${RAW_LABEL//[^a-zA-Z0-9_-]/}"
          [[ -z "$LABEL" ]] && LABEL="bench-ci"
          export SQLOCAML_BENCH_HOST="$LABEL"
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"
          mkdir -p bench/results
          opam exec -- dune exec test/bench_compare.exe 2>&1 \
            > "bench/results/${LABEL}.csv"
          echo "bench/results/${LABEL}.csv:"
          cat "bench/results/${LABEL}.csv"

      - name: Generate metadata
        env:
          RAW_LABEL: ${{ github.event.inputs.host_label }}
          ROWS: ${{ github.event.inputs.rows }}
          OPS: ${{ github.event.inputs.ops }}
          SCANS: ${{ github.event.inputs.scans }}
          COMMITS: ${{ github.event.inputs.commits }}
          REPEATS: ${{ github.event.inputs.repeats }}
          PAGE_CACHE: ${{ github.event.inputs.page_cache }}
        run: |
          LABEL="${RAW_LABEL//[^a-zA-Z0-9_-]/}"
          [[ -z "$LABEL" ]] && LABEL="bench-ci"
          {
            echo "host=$LABEL"
            echo "date=$(date -u +%FT%TZ)"
            echo "nproc=$(nproc)"
            echo "sqlite_version=$(sqlite3 --version | awk '{print $1}')"
            echo "sqlocaml_sha=$(git rev-parse --short HEAD)"
            echo "rows=$ROWS"
            echo "ops=$OPS"
            echo "scans=$SCANS"
            echo "commits=$COMMITS"
            echo "repeats=$REPEATS"
            echo "page_cache=$PAGE_CACHE"
            echo "storage=overlay-fs (ci-container /tmp)"
            DISK=$(lsblk -d -o NAME,ROTA,MODEL --noheadings 2>/dev/null | tr -s ' ' | head -3)
            echo "disk=${DISK:-unavailable}"
          } > "bench/results/${LABEL}.meta"
          cat "bench/results/${LABEL}.meta"

      - name: Upload results as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ steps.run.outputs.label }}
          path: bench/results/
          retention-days: 90

      - name: Commit results
        env:
          RAW_LABEL: ${{ github.event.inputs.host_label }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          LABEL="${RAW_LABEL//[^a-zA-Z0-9_-]/}"
          [[ -z "$LABEL" ]] && LABEL="bench-ci"
          git config user.name "bench-bot"
          git config user.email "bench-bot@iotready.com"
          git add bench/results/
          if git diff --cached --quiet; then
            echo "No new results to commit"
            exit 0
          fi
          git commit -m "bench(#345): results for ${LABEL}"
          git remote set-url origin "https://x-access-token:${TOKEN}@$(echo "${SERVER_URL}" | sed 's|https://||')/${REPOSITORY}.git"
          git pull --rebase origin "${BRANCH}"
          git push origin HEAD:"${BRANCH}"
