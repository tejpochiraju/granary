name: Coverage

# Re-enabled on OCaml 5.4 (#166). The blocker was that released bisect_ppx
# (2.8.3, last released 2023) constrains ppxlib < 0.36, while 5.4.1 forces
# lwt_ppx 6.1 -> ppxlib 0.38 — and lwt_ppx is non-negotiable (the engine uses
# let%lwt). bisect_ppx master relaxed the opam constraint but never adapted to
# the OCaml 5.2 AST change, so it still fails to compile ("Pexp_function
# expects 3 argument(s)"). The unmerged upstream PR aantron/bisect_ppx#448
# does adapt it; we pin that PR's head commit (same git-pin pattern this repo
# already uses for merlint). Drop the pin for a plain `bisect_ppx` dep once
# upstream cuts a release supporting ppxlib >= 0.36.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

env:
  # Measured handwritten coverage (excl. generated parser+lexer) is ~80%.
  # 75 leaves headroom for run-to-run variation while still catching a real
  # regression. Raise it as coverage improves.
  COVERAGE_THRESHOLD: "75"

jobs:
  coverage:
    runs-on: self-hosted
    container:
      image: ocaml/opam:ubuntu-24.04-ocaml-5.4

    steps:
      - name: Install Node.js (needed by actions/checkout)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nodejs

      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get install -y -q pkg-config libgmp-dev

      - name: Cache opam packages
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-5.4-cov-${{ hashFiles('granary.opam') }}
          restore-keys: opam-5.4-cov-

      - name: Install opam packages (including bisect_ppx)
        run: |
          opam install -y lwt cstruct menhir alcotest qcheck-alcotest lwt_ppx \
            mirage-block mirage-block-unix uutf uucp
          # bisect_ppx: see the header. Released 2.8.3 caps ppxlib < 0.36 and
          # upstream master doesn't build on the 5.2+ AST; this is the head of
          # the unmerged PR that fixes both. Pinned by commit so it can't shift.
          opam pin add -y -k git bisect_ppx \
            "https://github.com/patricoferris/bisect_ppx.git#7061d643ff492b0045796357ee6917ded21fb1f0"

      - name: Build and run instrumented tests
        # Same timing-gate neutralization as ci.yml. The bench_* suites run
        # under `dune runtest` for smoke coverage, but their speedup/wall-time
        # thresholds are unreliable on a shared runner — and instrumentation
        # slows everything further, so they fail near-deterministically here.
        env:
          GRANARY_BENCH_MIN_SPEEDUP: "0"
          GRANARY_BENCH_PARALLEL_MAX: "1000000"
          GRANARY_BENCH_MAX_WRITER_S: "1000000"
          GRANARY_BENCH_MAX_RATIO: "1000000"
        run: |
          opam exec -- dune runtest --instrument-with bisect_ppx

      - name: Generate coverage summary
        id: coverage
        run: |
          set -eu
          COVFILES=$(find _build -name '*.coverage' | tr '\n' ' ')
          if [ -z "$(printf '%s' "$COVFILES" | tr -d '[:space:]')" ]; then
            echo "ERROR: no coverage files found" >&2
            exit 1
          fi

          # bisect-ppx-report has no --exclude-files flag, so filter the
          # generated parser/lexer out here. awk, not python3 — the CI image
          # ships neither python3 nor bc.
          opam exec -- bisect-ppx-report summary --per-file $COVFILES > /tmp/cov_raw.txt
          # Plain field-splitting, no GNU-awk 3-arg match(): the image ships
          # mawk. Report lines are "<pct> % <hit>/<pts> <path>"; the trailing
          # "Project coverage" line has NF=5 with $4="Project".
          awk '
            $2 == "%" && $3 ~ /^[0-9]+\/[0-9]+$/ {
              path = $4
              if (NF >= 5 && path == "Project") next
              if (path == "lib/sql/parser.ml" || path == "lib/sql/lexer.ml") next
              split($3, a, "/")
              hit += a[1]; pts += a[2]
              print
            }
            END {
              pct = pts ? 100.0 * hit / pts : 0.0
              printf "%6.2f %%  %d/%d   Handwritten total (excl. generated parser+lexer)\n", pct, hit, pts
              printf "%.2f\n", pct > "/tmp/cov_pct.txt"
            }
          ' /tmp/cov_raw.txt

          PCT=$(cat /tmp/cov_pct.txt)
          echo "pct=${PCT}" >> "$GITHUB_OUTPUT"
          echo ""
          echo "Overall coverage: ${PCT}%"

      - name: Generate HTML report
        run: |
          COVFILES=$(find _build -name '*.coverage' | tr '\n' ' ')
          mkdir -p _coverage
          opam exec -- bisect-ppx-report html -o _coverage $COVFILES

      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: _coverage/
          retention-days: 30

      - name: Enforce threshold on tags
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PCT="${{ steps.coverage.outputs.pct }}"
          echo "Coverage: ${PCT}%  threshold: ${COVERAGE_THRESHOLD}%"
          # awk for the float compare — the CI image has no bc. Uses print,
          # not printf: mawk mishandles %% in some format strings.
          awk -v p="$PCT" -v t="$COVERAGE_THRESHOLD" 'BEGIN {
            if (p + 0 < t + 0) {
              print "FAIL: coverage " p "% is below threshold " t "%"
              exit 1
            }
            print "PASS: " p "% >= " t "%"
          }'
